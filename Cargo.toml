[workspace]
resolver = "2"
members = [
    "crates/tarmac-network",
    "crates/tarmac-corpus",
    "crates/tarmac-score",
    "crates/tarmac-tier",
    "crates/tarmac-gap",
    "crates/tarmac-cli",
    "crates/tarmac-web",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
